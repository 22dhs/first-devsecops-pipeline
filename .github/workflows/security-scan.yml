name: Day 2 Script Executor

on: [push]

jobs:
  run-bash-script:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Code
        uses: actions/checkout@v4

      # This step turns your script into an executable program and runs it
      - name: Execute Security Script
        run: |
          chmod +x day2_script.sh
          ./day2_script.sh
