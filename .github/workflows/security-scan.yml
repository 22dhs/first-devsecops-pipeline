name: Security Guard Dog

on: [push]

jobs:
  scan-my-code:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Code
        uses: actions/checkout@v4

      # We add an instruction telling the tool: "Show warnings, but don't crash the pipeline!"
      - name: Run Security Scan
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          soft_fail: true
